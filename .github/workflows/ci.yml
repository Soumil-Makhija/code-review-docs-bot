name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Installed CLI smoke
        run: |
          reviewlens --help
          python examples/make_demo.py /tmp/reviewlens-demo
          reviewlens snapshot /tmp/reviewlens-demo --base HEAD~1 --path calc.py --out /tmp/snapshot.json
          reviewlens verify evals/observed/2026-11-19/empty-regression-review.json --repo /tmp/reviewlens-demo
          reviewlens export evals/observed/2026-11-19/empty-regression-review.json --out /tmp/review.md
